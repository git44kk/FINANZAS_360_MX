name: FINANZAS 360 MX - Android CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Configurar Android SDK sin paquete tools obsoleto
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar Android SDK 36 y Build Tools
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Ejecutar pruebas unitarias y compilar APK
        run: |
          gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Publicar APK de depuracion
        uses: actions/upload-artifact@v6
        with:
          name: FINANZAS-360-MX-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
